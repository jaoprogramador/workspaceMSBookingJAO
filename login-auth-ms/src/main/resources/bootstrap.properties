spring.cloud.config.uri=http://localhost:8888
#Habilitamos el acceso de actuator/refresh
management.endpoints.web.exposure.include=*

spring.cloud.config.profile=dev
spring.application.name=Login-auth-ms

#PONEMOS PUERTO FIJO PARA USAR PROMETHEUS
#server.port=0
server.port=61198

#Definimos un id autogenerado para las instancias del MS
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# CONG VAULT
# ===========
spring.cloud.vault.uri=http://localhost:8200
spring.cloud.vault.application-name=Login-auth-ms
spring.cloud.vault.host=localhost
spring.cloud.vault.port=8200
spring.cloud.vault.schema=http
spring.cloud.vault.authentication=TOKEN
spring.cloud.vault.token=hvs.hmx3Iq7D3WEVspaXTJGY2tKY
spring.application.name=login-auth-ms

# CONF RABBITMQ
# ==============
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Kafka Producer
# ================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# CONF keyclock cliente
# ======================
#spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/booking-jao-ms-realm
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/JAO_REALM




# Nombre de tu FeignClient: coincide con @FeignClient(name = "gestVuelosService")
feign.client.config.gestVuelosService.connectTimeout=500
feign.client.config.gestVuelosService.readTimeout=500
#server.port=0

# LOGS
# =======
# Para que Logback use tu archivo logback\u2011spring.xml
logging.config=classpath:logback-spring.xml

# Overrides de nivel por paquete (alternativa al XML)
logging.level.root=INFO
logging.level.com.jao.booking=DEBUG

# Opcional: ruta de logs (si quieres cambiarla desde propiedades)
logging.file.path=logs
# 100% de muestreo en desarrollo
#spring.sleuth.sampler.probability=1.0
#spring.zipkin.base-url=http://localhost:9411
#spring.zipkin.sender.type=web
#spring.zipkin.enabled: false


# === CARGA DATOS FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=login_auth_db
spring.flyway.table=flyway_schema_history

# PARA VER TRAZAS MIGRACION
logging.level.org.flywaydb=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# MONITOREO ACTUATOR PROMETHEUS GRAFANA 
# =======================================
management.endpoints.web.exposure.include=*
management.endpoints.health.include.show=always
#management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true