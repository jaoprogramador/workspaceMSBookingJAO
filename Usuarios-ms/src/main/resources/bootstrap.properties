spring.cloud.config.uri=http://localhost:8888


#Habilitamos el acceso de actuator/refresh
management.endpoints.web.exposure.include=*

spring.cloud.config.profile=dev
spring.application.name=Usuarios-ms

#PONEMOS PUERTO FIJO PARA USAR PROMETHEUS
#server.port=0
server.port=8081

#Definimos un id autogenerado para las instancias del MS
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# CONG VAULT
# ===========
spring.cloud.vault.uri=http://localhost:8200
spring.cloud.vault.application-name=Usuarios-ms
spring.cloud.vault.host=localhost
spring.cloud.vault.port=8200
spring.cloud.vault.schema=http
spring.cloud.vault.authentication=TOKEN
spring.cloud.vault.token=hvs.674hp3cSrt0ItpkzsFWa0CtP
spring.application.name=Usuarios-ms

# CONF RABBITMQ
# ==============
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# CONF keyclock cliente
# ======================
#spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/booking-jao-ms-realm
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/JAO_REALM

# Configuramos un timer para el circuitbreaker
#================================================
resilience4j.circuitbreaker.instances.reservasCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.reservasCircuitBreaker.slidingWindowSize=5
resilience4j.circuitbreaker.instances.reservasCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.reservasCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.reservasCircuitBreaker.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.reservasCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.reservasCircuitBreaker.record-exceptions=feign.FeignException
resilience4j.circuitbreaker.instances.reservasCircuitBreaker.ignore-exceptions=


# Nombre de tu FeignClient: coincide con @FeignClient(name = "gestVuelosService")
feign.client.config.gestVuelosService.connectTimeout=500
feign.client.config.gestVuelosService.readTimeout=500
server.port=0
# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# === DATOS DE CONEXIoN A MYSQL (desde Docker Compose) === COMENTAMOS XQ AHORA VA EN /Service-configuration/Usuarios-ms.json

#spring.datasource.url=jdbc:mysql://localhost:3310/usuarios_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

#spring.datasource.username=usuarios_user
#spring.datasource.password=usuarios_pass
#spring.jpa.generate-ddl=true
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === CARGA DATOS FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=usuarios_db
spring.flyway.table=flyway_schema_history

# PARA VER TRAZAS MIGRACION
logging.level.org.flywaydb=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# MONITOREO PROMETHEUS GRAFANA 
# ==============================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true




# desactivamos vault
spring.cloud.vault.enabled=false
# desactivamos eureka server
spring.cloud.discovery.enabled=false
eureka.client.enabled=false