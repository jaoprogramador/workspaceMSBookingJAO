spring.cloud.config.profile=dev
spring.application.name=Reservas-ms

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# === DATOS DE CONEXIoN A MYSQL (desde Docker Compose) ===

#spring.datasource.url=jdbc:mysql://localhost:3307/reservas_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

spring.datasource.username=reservas_user
spring.datasource.password=reservas_pass

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=0

#Definimos un id autogenerado para las instancias del MS
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
