spring.cloud.config.uri=http://localhost:8888
#Habilitamos el acceso de actuator/refresh
management.endpoints.web.exposure.include=*

spring.cloud.config.profile=dev
spring.application.name=Reservas-ms

spring.datasource.username=reservas_user
spring.datasource.password=reservas_pass

server.port=0

#Definimos un id autogenerado para las instancias del MS
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true