spring.cloud.config.uri=http://localhost:8888


#Habilitamos el acceso de actuator/refresh
management.endpoints.web.exposure.include=*

spring.cloud.config.profile=dev
spring.application.name=Reservas-ms

#spring.datasource.username=reservas_user
#spring.datasource.password=reservas_pass

#PONEMOS PUERTO FIJO PARA USAR PROMETHEUS
#server.port=0
server.port=61200

#Definimos un id autogenerado para las instancias del MS
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# CONG VAULT
# ===========
spring.cloud.vault.uri=http://localhost:8200
spring.cloud.vault.application-name=Reservas-ms
spring.cloud.vault.host=localhost
spring.cloud.vault.port=8200
spring.cloud.vault.schema=http
spring.cloud.vault.authentication=TOKEN
#COMENTAMOS PARA COMMIT
spring.cloud.vault.token=hvs.yHWuypKkvTV8LCKMsfR4wCcT

# CONF RABBITMQ
# ==============
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# CONF keyclock cliente
# ======================
#spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/booking-jao-ms-realm
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/JAO_REALM

# Configuramos un timer para el circuitbreaker
#================================================
resilience4j.circuitbreaker.instances.reservasCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.reservasCircuitBreaker.slidingWindowSize=5
resilience4j.circuitbreaker.instances.reservasCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.reservasCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.reservasCircuitBreaker.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.reservasCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.reservasCircuitBreaker.record-exceptions=feign.FeignException
resilience4j.circuitbreaker.instances.reservasCircuitBreaker.ignore-exceptions=


# Nombre de tu FeignClient: coincide con @FeignClient(name = "gestVuelosService")
feign.client.config.gestVuelosService.connectTimeout=500
feign.client.config.gestVuelosService.readTimeout=500

# LOGS
# =======
# Para que Logback use tu archivo logback\u2011spring.xml
logging.config=classpath:logback-spring.xml

# Overrides de nivel por paquete (alternativa al XML)
logging.level.root=INFO
logging.level.com.jao.booking=DEBUG

# Opcional: ruta de logs (si quieres cambiarla desde propiedades)
logging.file.path=logs
