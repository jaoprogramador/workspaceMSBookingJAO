booking.property= Alquiler Vehiculos profile DEV

app.testProp=Property of test UPDATED for Bus and Message Broker
app.testPropVersion=Version 001

# Configuración JDBC solo para Flyway
# spring.datasource.url=jdbc:mysql://localhost:3312/alquilervehiculos_db
# spring.datasource.username=alquiler_user
# spring.datasource.password=alquiler_pass
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway activo y en modo automático
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Otros parámetros si aplican
spring.sql.init.mode=always

# Si usas Flyway o Liquibase para migraciones, configura aquí

# Desactiva JPA (no se debe usar con WebFlux/reactivo)
spring.jpa.hibernate.ddl-auto=none

