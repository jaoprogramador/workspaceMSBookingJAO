spring.application.name=Api-gateway
# esta anotacion habilita el cliente de discoveryclient
spring.cloud.gateway.discovery.locator.enabled=true
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

spring.cloud.loadbalancer.ribbon.enabled=false

#Lista de MS registrados ENRUTADO
#====================================
spring.cloud.gateway.routes[0].id=GestVuelos-ms
spring.cloud.gateway.routes[0].uri=lb://GESTVUELOS-MS
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/categories/**, /api/vuelos/**

spring.cloud.gateway.routes[1].id=Reservas-ms
spring.cloud.gateway.routes[1].uri=lb://RESERVAS-MS
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/reservas/**

spring.cloud.gateway.routes[2].id=Notificaciones-ms
spring.cloud.gateway.routes[2].uri=lb://NOTIFICACIONES-MS
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/notificaciones/**

spring.cloud.gateway.routes[3].id=Usuarios-ms
spring.cloud.gateway.routes[3].uri=lb://USUARIOS-MS
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/usuarios/**

spring.cloud.gateway.routes[4].id=GestHoteles-ms
spring.cloud.gateway.routes[4].uri=lb://GESTHOTELES-MS
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/hoteles/**

spring.cloud.gateway.routes[5].id=AlquilVehiculos-ms
spring.cloud.gateway.routes[5].uri=lb://ALQUILVEHICULOS-MS
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/alquiler/**

spring.cloud.gateway.routes[6].id=usuarios-swagger
spring.cloud.gateway.routes[6].uri=lb://USUARIOS-MS
spring.cloud.gateway.routes[6].predicates[0]=Path=/swagger-ui/**
spring.cloud.gateway.routes[6].predicates[1]=Path=/v3/api-docs/**
spring.cloud.gateway.routes[6].filters[0]=StripPrefix=0

spring.cloud.gateway.routes[7].id=reservas-swagger
spring.cloud.gateway.routes[7].uri=lb://RESERVAS-MS
spring.cloud.gateway.routes[7].predicates[0]=Path=/swagger-ui/**
spring.cloud.gateway.routes[7].predicates[1]=Path=/v3/api-docs/**
spring.cloud.gateway.routes[7].filters[0]=StripPrefix=0

spring.cloud.gateway.routes[8].id=notificaciones-swagger
spring.cloud.gateway.routes[8].uri=lb://NOTIFICACIONES-MS
spring.cloud.gateway.routes[8].predicates[0]=Path=/swagger-ui/**
spring.cloud.gateway.routes[8].predicates[1]=Path=/v3/api-docs/**
spring.cloud.gateway.routes[8].filters[0]=StripPrefix=0

spring.cloud.gateway.routes[9].id=GestHoteles-swagger
spring.cloud.gateway.routes[9].uri=lb://GESTHOTELES-MS
spring.cloud.gateway.routes[9].predicates[0]=Path=/swagger-ui/**
spring.cloud.gateway.routes[9].predicates[1]=Path=/v3/api-docs/**
spring.cloud.gateway.routes[9].filters[0]=StripPrefix=0

spring.cloud.gateway.routes[10].id=Login-auth-swagger
spring.cloud.gateway.routes[10].uri=lb://LOGIN-AUTH-MS
spring.cloud.gateway.routes[10].predicates[0]=Path=/swagger-ui/**
spring.cloud.gateway.routes[10].predicates[1]=Path=/v3/api-docs/**
spring.cloud.gateway.routes[10].filters[0]=StripPrefix=0

