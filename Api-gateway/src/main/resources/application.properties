# KEYCLOCK

spring.cloud.gateway.default-filters=TokenRelay

# ===== OAUTH2 CLIENT (Keycloak) =====
# Proveedor (Issuer)
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:9090/realms/JAO_REALM

# Registro de cliente: JAO_CLIENT (este es el nombre que Keycloak debe tener como client_id)
spring.security.oauth2.client.registration.JAO_CLIENT.client-id=JAO_CLIENT
